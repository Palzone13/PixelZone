<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Proxy — PIXELZONE</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Exo+2:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #10101a;
      --neon-cyan: #00f5ff;
      --neon-pink: #ff00aa;
      --neon-yellow: #ffe600;
      --text: #e8e8ff;
      --muted: #5a5a7a;
      --card-bg: #12121e;
      --card-border: #1e1e32;
      --glow-cyan: 0 0 8px #00f5ff88, 0 0 24px #00f5ff44, 0 0 48px #00f5ff22;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
      pointer-events: none;
      z-index: 1000;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(0,245,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,245,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,245,255,0.15);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: rgba(10,10,15,0.85);
      border: 1px solid rgba(0,245,255,0.4);
      color: #00f5ff;
      font-family: Tahoma, sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn:hover {
      background: rgba(0,245,255,0.15);
      box-shadow: 0 0 12px rgba(0,245,255,0.3);
    }

    .url-bar {
      flex: 1;
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid rgba(0,245,255,0.3);
      border-radius: 4px;
      padding: 10px 16px;
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .url-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 0 2px rgba(0,245,255,0.15);
    }

    .url-input::placeholder {
      color: var(--muted);
    }

    .go-btn {
      background: var(--neon-cyan);
      color: #0a0a0f;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .go-btn:hover {
      background: #80faff;
      box-shadow: var(--glow-cyan);
    }

    .nav-btns {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--neon-cyan);
      background: rgba(0,245,255,0.1);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Proxy Frame */
    .proxy-container {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }

    .proxy-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(0,245,255,0.2);
      border-top-color: var(--neon-cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .welcome {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      max-width: 600px;
      padding: 40px;
      z-index: 1;
    }

    .welcome h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: var(--neon-cyan);
      text-shadow: var(--glow-cyan);
      line-height: 1.8;
      margin-bottom: 1rem;
    }

    .welcome p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .quick-link {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .quick-link:hover {
      border-color: var(--neon-cyan);
      background: rgba(0,245,255,0.1);
      color: var(--neon-cyan);
    }

    @media (max-width: 700px) {
      .top-bar {
        flex-wrap: wrap;
      }
      .url-bar {
        order: 2;
        width: 100%;
      }
      .nav-btns {
        order: 1;
      }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a class="back-btn" href="index.html">← Back</a>
  
  <div class="nav-btns">
    <button class="nav-btn" id="backBtn" disabled>←</button>
    <button class="nav-btn" id="forwardBtn" disabled>→</button>
    <button class="nav-btn" id="refreshBtn">⟳</button>
  </div>

  <div class="url-bar">
    <input type="text" class="url-input" id="urlInput" placeholder="Enter website URL (e.g., youtube.com)">
    <button class="go-btn" id="goBtn">Go</button>
  </div>
</div>

<div class="proxy-container">
  <div class="welcome" id="welcomeScreen">
    <h1>WEB PROXY</h1>
    <p>Browse any website through our proxy. Enter a URL above or click a quick link below.</p>
    <div class="quick-links">
      <a class="quick-link" href="#" data-url="https://www.youtube.com">YouTube</a>
      <a class="quick-link" href="#" data-url="https://www.reddit.com">Reddit</a>
      <a class="quick-link" href="#" data-url="https://www.twitter.com">Twitter</a>
      <a class="quick-link" href="#" data-url="https://www.discord.com">Discord</a>
      <a class="quick-link" href="#" data-url="https://www.wikipedia.org">Wikipedia</a>
      <a class="quick-link" href="#" data-url="https://www.github.com">GitHub</a>
    </div>
  </div>

  <div class="loading" id="loading" style="display:none;">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>

  <iframe class="proxy-frame" id="proxyFrame" style="display:none;"></iframe>
</div>

<script>
  const urlInput = document.getElementById('urlInput');
  const goBtn = document.getElementById('goBtn');
  const backBtn = document.getElementById('backBtn');
  const forwardBtn = document.getElementById('forwardBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const proxyFrame = document.getElementById('proxyFrame');
  const welcomeScreen = document.getElementById('welcomeScreen');
  const loading = document.getElementById('loading');
  
  let history = [];
  let currentIndex = -1;

  // Proxy services (multiple options)
  const proxyServices = [
    'https://www.croxyproxy.com/go?q=',
    'https://www.proxysite.com/process.php?d=',
    'https://hide.me/en/proxy?u='
  ];
  
  let currentProxyIndex = 0;

  // Go button
  goBtn.addEventListener('click', () => {
    let url = urlInput.value.trim();
    if (!url) return;
    
    // Add https if not present
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = 'https://' + url;
    }
    
    loadUrl(url);
  });

  urlInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') goBtn.click();
  });

  // Quick links
  document.querySelectorAll('.quick-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const url = link.dataset.url;
      urlInput.value = url;
      loadUrl(url);
    });
  });

  // Navigation buttons
  backBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      loadFromHistory();
    }
  });

  forwardBtn.addEventListener('click', () => {
    if (currentIndex < history.length - 1) {
      currentIndex++;
      loadFromHistory();
    }
  });

  refreshBtn.addEventListener('click', () => {
    if (currentIndex >= 0) {
      proxyFrame.src = proxyFrame.src;
    }
  });

  function loadUrl(url) {
    welcomeScreen.style.display = 'none';
    loading.style.display = 'block';
    proxyFrame.style.display = 'none';

    // Add to history
    if (currentIndex < history.length - 1) {
      history = history.slice(0, currentIndex + 1);
    }
    history.push(url);
    currentIndex = history.length - 1;
    updateNavButtons();

    // Try loading through proxy
    const proxyUrl = proxyServices[currentProxyIndex] + encodeURIComponent(url);
    proxyFrame.src = proxyUrl;

    // Show frame after a delay
    setTimeout(() => {
      loading.style.display = 'none';
      proxyFrame.style.display = 'block';
    }, 1500);
  }

  function loadFromHistory() {
    const url = history[currentIndex];
    urlInput.value = url;
    
    welcomeScreen.style.display = 'none';
    loading.style.display = 'block';
    proxyFrame.style.display = 'none';

    const proxyUrl = proxyServices[currentProxyIndex] + encodeURIComponent(url);
    proxyFrame.src = proxyUrl;

    setTimeout(() => {
      loading.style.display = 'none';
      proxyFrame.style.display = 'block';
    }, 1500);

    updateNavButtons();
  }

  function updateNavButtons() {
    backBtn.disabled = currentIndex <= 0;
    forwardBtn.disabled = currentIndex >= history.length - 1;
  }

  // Handle frame load errors - try next proxy
  proxyFrame.addEventListener('error', () => {
    currentProxyIndex = (currentProxyIndex + 1) % proxyServices.length;
    if (currentIndex >= 0) {
      const url = history[currentIndex];
      const proxyUrl = proxyServices[currentProxyIndex] + encodeURIComponent(url);
      proxyFrame.src = proxyUrl;
    }
  });
</script>

</body>
</html>
